plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.+'
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}
base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	//maven { url 'https://maven.nucleoid.xyz' }
	maven { url 'https://maven.nucleoid.xyz' }
	maven { url 'https://jitpack.io' }
	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	mavenLocal()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	implementation include('xyz.nucleoid:server-translations-api:3.2.0+26.3')
	implementation 'eu.pb4:polymer-core:0.18.0+26.3-rc-1'
	implementation 'eu.pb4:polymer-virtual-entity:0.18.0+26.3-rc-1'
	implementation 'eu.pb4:polymer-resource-pack:0.18.0+26.3-rc-1'
	localRuntime 'eu.pb4:polymer-autohost:0.18.0+26.3-rc-1'
	implementation include("eu.pb4:sgui:2.2.0+26.3")
	implementation include("eu.pb4:placeholder-api:3.1.0-beta.1+26.2")
	implementation include("eu.pb4:common-protection-api:2.0.0")
	implementation include("eu.pb4:common-economy-api:2.0.0")
	//implementation include("com.github.sakura-ryoko:fabric-permissions-api:dev~snapshot-jitpack-SNAPSHOT")

	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// implementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}

	from("src/main/resources/data/universal_shops/lang") {
		into("assets/universal_shops/lang")
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}


publishMods {
	changelog = System.getenv("CHANGELOG")
	type = project.mod_version.contains("-") ? BETA : STABLE
	file = jar.archiveFile
	modLoaders.add("fabric")

	if (System.getenv("CURSEFORGE")) {
		curseforge {
			projectId = "705362"
			accessToken = System.getenv("CURSEFORGE")
			client = true
			server = true

			minecraftVersions.add((project.minecraft_version.contains("-") ? ((String) project.minecraft_version.split("-")[0] + "-snapshot") : project.minecraft_version))
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("polymer")
		}
	}

	if (System.getenv("MODRINTH")) {
		modrinth {
			accessToken = System.getenv("MODRINTH")
			projectId = 'cnIatHrN'

			minecraftVersions.add(project.minecraft_version);
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("polymer")
		}
	}
}